<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거울빛: 쌍거울의 무덤</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif; color: #ead9b8; }
  canvas { display: block; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,230,180,.85);
    pointer-events: none; }
  body.avatar #crosshair { background: rgba(255,190,120,.85); }
  #prompt { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
    font-size: 17px; letter-spacing: .04em; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #message { position: fixed; left: 50%; top: 24%; transform: translateX(-50%);
    font-size: 19px; opacity: 0; transition: opacity .5s; text-shadow: 0 1px 6px #000;
    pointer-events: none; white-space: nowrap; max-width: 92vw; }
  #modehint { position: fixed; left: 16px; top: 14px; font-size: 13px; opacity: .75; }
  #carry, #inventory { position: fixed; left: 16px; bottom: 14px; font-size: 14px;
    display: none; color: #e0c078; }
  #inventory { bottom: 36px; color: #c0a468; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(6,4,2,.9);
    cursor: pointer; text-align: center; z-index: 10; }
  .overlay h1 { font-weight: 600; letter-spacing: .3em; margin: 0; }
  .overlay p { margin: 0; line-height: 1.9; opacity: .82; font-size: 14px; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 5; }
  #win { display: none; background: rgba(8,6,2,.94); cursor: default; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="message"></div>
  <div id="modehint">본체 — 현재</div>
  <div id="inventory"></div>
  <div id="carry"></div>
  <div id="fade"></div>

  <div id="start" class="overlay">
    <h1>쌍거울의 무덤</h1>
    <p>너는 도굴꾼이다. 크립트는 이미 뜯겨 있고, 보석은 3천 년 전에 사라졌다.<br>
    그들보다 먼저 도착하는 방법은 하나뿐이다.</p>
    <p>
      WASD 이동 · 마우스 시점 · E 상호작용 · G 놓기(분신) · F 빙의/복귀<br>
      거울: 바라보고 휠 = 회전 (두 청동 거울은 서로를 마주 본다)
    </p>
    <p>클릭하여 시작</p>
  </div>

  <div id="win" class="overlay">
    <h1>가슴장식</h1>
    <p>사제단은 제자리에 돌려놓았고, 도굴꾼은 보이는 것만 가져갔다.<br>
    너는 그 둘 사이의 하룻밤을 훔쳤다.<br>
    새로고침하면 처음부터 다시 시작한다.</p>
  </div>

  <script type="module" src="./src/pyramid/main.js"></script>
</body>
</html>
