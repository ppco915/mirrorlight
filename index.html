<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타임즈</title>
<meta property="og:type" content="website">
<meta property="og:title" content="타임즈 (TIMES)">
<meta property="og:description" content="거울에 비친 과거로 건너가 무덤을 탈출하는 1인칭 시간여행 퍼즐 — 설치 없이 브라우저에서 바로 플레이">
<meta property="og:image" content="https://ppco915.github.io/mirrorlight/assets/og.png">
<meta property="og:url" content="https://ppco915.github.io/mirrorlight/">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', sans-serif; color: #e6d7b8; }
  canvas { display: block; }
  /* 거울 속(분신) 시점은 화면만 좌우 반전한다 — GL 투영을 뒤집으면 와인딩이
     반전돼 DoubleSide 조명 법선이 뒤집히므로, 반전은 합성 단계에서 한다. */
  body.avatar canvas { transform: scaleX(-1); }
  body.avatar #menucv { transform: none; }

  /* 비네트 — 어두운 무덤의 공기 */
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.28) 78%, rgba(0,0,0,.62) 100%); }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; border-radius: 50%; border: 1.5px solid rgba(255,230,180,.8);
    box-shadow: 0 0 6px rgba(0,0,0,.6); pointer-events: none; z-index: 3; }
  body.avatar #crosshair { border-color: rgba(255,180,100,.9); }

  /* 벽돌 잡아당기기(E 길게) — 게이지가 차오르고, 화면이 힘겨워진다 */
  #pullbar { position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    width: 132px; height: 6px; display: none; z-index: 3; pointer-events: none;
    border: 1px solid rgba(222,178,92,.55); border-radius: 4px;
    background: rgba(10,7,3,.6); box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #pullbar i { display: block; height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, #8a6426, #e8c477); }
  /* 힌트(H 길게) — 같은 모양의 게이지지만 자리를 낮춰 벽돌 게이지와 겹치지 않는다 */
  #hintbar { position: fixed; left: 50%; top: calc(50% + 48px); transform: translateX(-50%);
    width: 132px; display: none; z-index: 3; pointer-events: none; text-align: center; }
  #hintbar u { display: block; height: 6px; border-radius: 4px;
    border: 1px solid rgba(222,178,92,.55); background: rgba(10,7,3,.6);
    box-shadow: 0 1px 4px rgba(0,0,0,.6); overflow: hidden; }
  #hintbar i { display: block; height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, #8a6426, #e8c477); }
  #hintbar b { display: block; margin-top: 6px; font-size: 11px; font-weight: 400;
    letter-spacing: .18em; color: #d8c191; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  @keyframes strain {
    0% { transform: translate(-1px, 0); } 25% { transform: translate(1px, 1px); }
    50% { transform: translate(-1px, 1px); } 75% { transform: translate(1px, -1px); }
    100% { transform: translate(-1px, 0); } }
  body.pulling #crosshair { animation: strain .12s linear infinite; }
  #vignette { transition: box-shadow .3s; }
  body.pulling #vignette { box-shadow: inset 0 0 150px rgba(0,0,0,.55); }

  /* 힌트 잔량 — 왼쪽 위 전구들과 H 안내 버튼 (게임 중에만 보인다) */
  #hinthud { position: fixed; top: 14px; left: 16px; z-index: 3; display: none;
    align-items: center; gap: 9px; pointer-events: none; }
  body.playing #hinthud { display: flex; }
  body.cinema #hinthud { display: none !important; }
  #bulbs { display: flex; gap: 6px; padding: 8px 12px; border-radius: 22px;
    background: rgba(12,8,4,.55); border: 1px solid rgba(222,178,92,.5);
    box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #bulbs svg { width: 17px; height: 17px; display: block; }
  #bulbs .on svg { filter: drop-shadow(0 0 4px rgba(255,205,100,.75)); }
  #bulbs .off svg { opacity: .3; }
  #bulbs .off path, #bulbs .off rect { fill: #5c4c30; }
  #hintBtn { display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    border-radius: 22px; background: rgba(12,8,4,.55); border: 1px solid rgba(222,178,92,.5);
    color: #ecd9ac; font-size: 13px; letter-spacing: .05em;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); transition: border-color .2s, box-shadow .2s, opacity .3s; }
  #hintBtn kbd { display: inline-block; min-width: 14px; padding: 2px 9px; text-align: center;
    border: 1px solid rgba(222,178,92,.6); border-bottom-width: 2px;
    border-radius: 6px; background: rgba(45,32,14,.85); color: #f2ddab;
    font-family: inherit; font-size: 13px; font-weight: 700; }
  #hinthud.arming #hintBtn { border-color: rgba(248,210,122,.95);
    box-shadow: 0 0 14px rgba(238,196,106,.4); }
  #hinthud.spent #hintBtn { opacity: .5; }

  #prompt { position: fixed; left: 50%; bottom: 16%; transform: translateX(-50%);
    font-size: 16px; letter-spacing: .05em; color: #f0e3c4;
    text-shadow: 0 1px 4px #000, 0 0 18px rgba(0,0,0,.8);
    background: rgba(10,7,3,.45); padding: 7px 16px; border-radius: 20px;
    border: 1px solid rgba(214,178,106,.22); pointer-events: none; z-index: 3; }
  #prompt:empty { display: none; }

  #message { position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
    font-size: 18px; line-height: 1.7; opacity: 0; transition: opacity .5s;
    text-shadow: 0 1px 6px #000, 0 0 22px rgba(0,0,0,.9); pointer-events: none;
    text-align: center; max-width: 78vw; z-index: 3; }

  /* 내려놓을 수 있는 물건을 들었을 때만 보이는 G 안내 버튼 */
  #dropBtn { position: fixed; right: 20px; bottom: 22px; z-index: 3;
    display: none; align-items: center; gap: 9px; pointer-events: none;
    padding: 10px 16px; border-radius: 24px;
    background: rgba(12,8,4,.55); border: 1px solid rgba(222,178,92,.5);
    color: #ecd9ac; font-size: 14px; letter-spacing: .04em;
    box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 14px rgba(222,178,92,.12); }
  body.candrop #dropBtn { display: flex; }
  #dropBtn kbd { display: inline-block; min-width: 14px; padding: 2px 9px;
    border: 1px solid rgba(222,178,92,.6); border-bottom-width: 2px;
    border-radius: 6px; background: rgba(45,32,14,.85); color: #f2ddab;
    font-family: inherit; font-size: 13px; font-weight: 700; }

  /* 아이템 슬롯 바 — 칸은 DOM, 내용물은 캔버스에 겹쳐 그리는 실물 3D 아이템.
     들고 있는 것에는 숫자 배지가 붙고, 숫자 키로 골라 든다(지금 손에 든 것은 밝은 금테). */
  #slots { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 3; pointer-events: none; }
  #slots .slot { position: relative; width: 64px; height: 64px; border-radius: 10px;
    background: rgba(10,7,3,.38); border: 1px solid rgba(150,130,95,.45);
    box-shadow: inset 0 0 14px rgba(0,0,0,.55), 0 1px 6px rgba(0,0,0,.5);
    transition: transform .15s, border-color .15s, box-shadow .15s; }
  #slots .slot.hand { border-color: rgba(196,155,86,.6); }
  #slots .slot.sel { border-color: rgba(248,210,122,.95); transform: translateY(-4px);
    box-shadow: inset 0 0 14px rgba(0,0,0,.55), 0 0 14px rgba(238,196,106,.45); }
  #slots .slot .num { position: absolute; top: 2px; left: 6px; font-size: 10px;
    font-weight: 700; color: rgba(242,224,182,.85); text-shadow: 0 1px 2px #000; }
  #handName { position: fixed; left: 50%; bottom: 94px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .06em; color: #d9c391; z-index: 3;
    text-shadow: 0 1px 3px #000; pointer-events: none; }
  #handName:empty { display: none; }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
    cursor: pointer; z-index: 10;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(96,62,20,.28), transparent 55%),
      radial-gradient(ellipse at center, rgba(10,7,3,.86) 0%, rgba(3,2,1,.96) 100%); }
  .overlay h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .34em;
    text-indent: .34em;
    background: linear-gradient(180deg, #f4dfa8 0%, #cfa14e 55%, #8a6426 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.8)); }
  .overlay .sub { font-size: 13px; letter-spacing: .5em; text-indent: .5em;
    color: #9a8258; margin-top: -6px; }
  .overlay .rule { width: 220px; height: 1px; margin: 4px 0;
    background: linear-gradient(90deg, transparent, #b08a4a, transparent); }
  .overlay p { margin: 0; line-height: 2.0; opacity: .88; font-size: 15px; max-width: 620px; }
  .overlay .go { font-size: 13px; letter-spacing: .3em; text-indent: .3em; color: #8f7a52;
    animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ── 시작 화면: 모험가의 지도 탁자 (menu.js가 그리는 3D 씬 위의 UI) ── */
  #start { position: fixed; inset: 0; z-index: 10; overflow: hidden; background: #0b0705; }
  #menucv { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .m-shade { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 44%, rgba(5,3,1,.32) 78%, rgba(3,2,1,.6) 100%); }
  #mTitle { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding-bottom: 4vh;
    pointer-events: none; transition: opacity .7s, transform .7s; }
  #mTitle.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
  #mTitle .m-eyebrow { font-size: 13px; letter-spacing: .82em; text-indent: .82em;
    color: #b39a63; text-shadow: 0 1px 6px rgba(0,0,0,.9);
    animation: riseIn .9s ease-out both .15s; }
  h1.m-logo { margin: 0; font-family: 'Song Myung', 'Nanum Myeongjo', serif;
    font-size: clamp(64px, 11vw, 122px); font-weight: 400; line-height: 1.15;
    letter-spacing: .16em; text-indent: .16em;
    background: linear-gradient(180deg, #fdf0c0 0%, #edc464 40%, #b7822f 74%, #7c5a20 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.9)) drop-shadow(0 0 26px rgba(216,164,74,.22));
    animation: riseIn 1.1s cubic-bezier(.2,.7,.2,1) both .3s; }
  .m-cta { appearance: none; -webkit-appearance: none; margin-top: 26px;
    padding: 14px 52px; border-radius: 999px; cursor: pointer; pointer-events: auto;
    border: 1px solid rgba(222,178,92,.6); color: #f2dfae; font-family: inherit;
    font-size: 15px; letter-spacing: .32em; text-indent: .32em;
    background: linear-gradient(180deg, rgba(74,52,20,.78), rgba(30,20,8,.85));
    box-shadow: 0 4px 18px rgba(0,0,0,.55), 0 0 22px rgba(222,178,92,.12);
    transition: box-shadow .25s, border-color .25s, transform .15s;
    animation: riseIn 1s ease-out both .7s, ctaPulse 2.4s ease-in-out 2.4s infinite; }
  .m-cta:hover:not(:disabled) { border-color: rgba(240,202,118,.9);
    box-shadow: 0 4px 18px rgba(0,0,0,.55), 0 0 30px rgba(232,190,104,.35); }
  .m-cta:active:not(:disabled) { transform: translateY(1px); }
  .m-cta:disabled { opacity: .4; cursor: default; animation: none; }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 4px 18px rgba(0,0,0,.55), 0 0 12px rgba(222,178,92,.1); }
    50% { box-shadow: 0 4px 18px rgba(0,0,0,.55), 0 0 30px rgba(232,190,104,.34);
      border-color: rgba(240,202,118,.85); } }
  #bootmsg { min-height: 1.2em; margin-top: 14px; font-size: 12.5px; color: #e0a050;
    text-shadow: 0 1px 4px #000; max-width: 70vw; }
  #mCaption { position: absolute; top: 6.5%; left: 50%; transform: translateX(-50%);
    opacity: 0; transition: opacity .9s; pointer-events: none;
    font-size: 13px; letter-spacing: .36em; text-indent: .36em; color: #cbb992;
    text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  #mCaption.show { opacity: .82; }
  #mPanel { position: absolute; left: 50%; bottom: 6.5%; transform: translate(-50%, 16px);
    opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s;
    text-align: center; padding: 20px 44px 24px; border-radius: 14px;
    background: rgba(16,10,5,.74); border: 1px solid rgba(214,178,106,.35);
    backdrop-filter: blur(6px); box-shadow: 0 10px 40px rgba(0,0,0,.55); }
  #mPanel.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #mPanel .m-region { font-size: 12px; letter-spacing: .3em; text-indent: .3em;
    color: #a08b60; margin-bottom: 7px; }
  #mPanel .m-name { font-family: 'Song Myung', 'Nanum Myeongjo', serif; font-size: 27px;
    color: #f0dca8; letter-spacing: .1em; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  #mPanel .m-cta { margin-top: 16px; padding: 11px 42px; font-size: 14px; animation: none; }
  #mTip { position: absolute; display: none; pointer-events: none; z-index: 2;
    padding: 6px 13px; border-radius: 8px; white-space: nowrap;
    background: rgba(12,8,4,.85); border: 1px solid rgba(214,178,106,.32);
    font-size: 13px; color: #ecd9ac; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #mFade { position: absolute; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity .8s; }
  #mFade.on { opacity: 1; }

  body.cinema #slots, body.cinema #handName, body.cinema #dropBtn,
  body.cinema #crosshair, body.cinema #prompt, body.cinema #pullbar,
  body.cinema #hintbar { display: none !important; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 5; }
  #win { display: none; cursor: default; }
  #resume { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <div id="pullbar"><i></i></div>
  <div id="hintbar"><u><i></i></u><b>힌트 보기</b></div>
  <div id="hinthud">
    <div id="bulbs">
      <span class="on"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-3.9 12.8c.55.38.9 1 .9 1.67v.53h6v-.53c0-.67.35-1.29.9-1.67A7 7 0 0 0 12 2z" fill="#ffd977"/><rect x="9.2" y="18.4" width="5.6" height="1.7" rx=".85" fill="#c9a24e"/><rect x="10" y="21" width="4" height="1.5" rx=".75" fill="#c9a24e"/></svg></span>
      <span class="on"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-3.9 12.8c.55.38.9 1 .9 1.67v.53h6v-.53c0-.67.35-1.29.9-1.67A7 7 0 0 0 12 2z" fill="#ffd977"/><rect x="9.2" y="18.4" width="5.6" height="1.7" rx=".85" fill="#c9a24e"/><rect x="10" y="21" width="4" height="1.5" rx=".75" fill="#c9a24e"/></svg></span>
      <span class="on"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-3.9 12.8c.55.38.9 1 .9 1.67v.53h6v-.53c0-.67.35-1.29.9-1.67A7 7 0 0 0 12 2z" fill="#ffd977"/><rect x="9.2" y="18.4" width="5.6" height="1.7" rx=".85" fill="#c9a24e"/><rect x="10" y="21" width="4" height="1.5" rx=".75" fill="#c9a24e"/></svg></span>
    </div>
    <div id="hintBtn"><kbd>H</kbd><span>길게 눌러 힌트</span></div>
  </div>
  <div id="prompt"></div>
  <div id="message"></div>
  <div id="dropBtn"><kbd>G</kbd> 내려놓기</div>
  <div id="handName"></div>
  <div id="slots"></div>
  <div id="fade"></div>

  <script>
  // 부팅 진단 — 모듈 로드 실패·미처리 예외를 시작 화면에 그대로 보여 준다.
  // 시작 버튼이 「눌러도 조용히 무반응」이 되는 부류의 결함을 보이는 결함으로 바꾼다.
  window.__bootError = null;
  function __showBoot(msg) {
    window.__bootError = msg;
    var el = document.getElementById('bootmsg');
    if (el) el.textContent = '⚠ ' + msg;
  }
  addEventListener('error', function (e) {
    __showBoot((e.message || '알 수 없는 오류') + (e.filename ? ' — ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  addEventListener('unhandledrejection', function (e) {
    __showBoot('약속 거부: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)).slice(0, 160));
  });
  </script>
  <div id="start">
    <canvas id="menucv"></canvas>
    <div class="m-shade"></div>
    <div id="mCaption">지도 위의 유적을 선택하십시오</div>
    <div id="mTitle">
      <div class="m-eyebrow">TIMES</div>
      <h1 class="m-logo">타임즈</h1>
      <button id="mAdventure" class="m-cta" type="button">모험하기</button>
      <div id="bootmsg"></div>
    </div>
    <div id="mPanel">
      <div class="m-region"></div>
      <div class="m-name"></div>
      <button id="mEnter" class="m-cta" type="button">모험하기</button>
    </div>
    <div id="mTip"></div>
    <div id="mFade"></div>
  </div>

  <div id="resume" class="overlay">
    <h1>일시 정지</h1>
    <div class="sub">저주받은 거울의 무덤</div>
    <div class="rule"></div>
    <div class="go">클릭하여 계속</div>
  </div>

  <div id="win" class="overlay">
    <h1></h1>
    <div class="rule"></div>
    <p></p>
    <div class="go">클릭하여 계속</div>
  </div>

  <script type="module" src="./src/pyramid/main.js"></script>
</body>
</html>
